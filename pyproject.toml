[project]
name = "opencode-workspace"
version = "0.1.0"
requires-python = ">=3.12"

[tool.uv]
dev-dependencies = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.uv.sources]
opencode-llm = { workspace = true }
opencode-core = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
