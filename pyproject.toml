[project]
name = "testcode-workspace"
version = "0.1.0"
requires-python = ">=3.12"

[tool.uv]
dev-dependencies = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.28"]

[tool.uv.sources]
testcode-llm = { workspace = true }
testcode-core = { workspace = true }
testcode-tui = { workspace = true }
testcode-server = { workspace = true }
testcode-sdk = { workspace = true }
testcode-plugin = { workspace = true }
testcode-desktop = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
