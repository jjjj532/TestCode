[project]
name = "opencode-core"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["opencode-llm>=0.1.0", "httpx>=0.28", "sqlalchemy>=2.0", "aiosqlite>=0.20"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = ["pytest>=8", "pytest-asyncio>=0.24"]
