[project]
name = "testcode-server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "testcode-core>=0.1.0",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "sse-starlette>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.28"]
