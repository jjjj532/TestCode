[project]
name = "testcode-desktop"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "testcode-core>=0.1.0",
    "testcode-tui>=0.1.0",
    "textual-serve>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = ["pytest>=8", "pytest-asyncio>=0.24"]
