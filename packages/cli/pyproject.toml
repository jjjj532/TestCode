[project]
name = "testcode-cli"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["testcode-core>=0.1.0", "testcode-tui>=0.1.0", "testcode-server>=0.1.0", "testcode-plugin>=0.1.0", "testcode-desktop>=0.1.0", "typer>=0.15"]

[project.scripts]
testcode = "testcode_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = ["pytest>=8", "pytest-asyncio>=0.24"]
