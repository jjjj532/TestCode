[project]
name = "opencode-llm"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28"]

[project.optional-dependencies]
anthropic = ["anthropic>=0.49"]
openai = ["openai>=1.55"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = ["pytest>=8", "pytest-asyncio>=0.24"]
