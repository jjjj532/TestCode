name: Build TestCode

on:
  push:
    branches: [master]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y patchelf libcairo2-dev

      - name: Install dependencies
        shell: bash
        run: |
          uv sync
          uv pip install -e packages/*
          uv pip install pyinstaller

      - name: Debug - check Python and packages
        shell: bash
        run: |
          uv run python -c "import testcode_core; print('testcode_core OK:', testcode_core.__file__)"
          uv run python -c "import testcode_llm; print('testcode_llm OK')"
          uv run python -c "import testcode_cli; print('testcode_cli OK')"
          uv run python -c "import testcode_tui; print('testcode_tui OK')"
          uv run python -c "import testcode_server; print('testcode_server OK')"
          uv run python -c "import testcode_sdk; print('testcode_sdk OK')"
          uv run python -c "import testcode_plugin; print('testcode_plugin OK')"
          uv run python -c "import testcode_desktop; print('testcode_desktop OK')"

      - name: Build with PyInstaller
        shell: bash
        run: |
          uv run pyinstaller --clean --onefile --name testcode \
            --hidden-import testcode_core \
            --hidden-import testcode_core.agent \
            --hidden-import testcode_core.agent.context \
            --hidden-import testcode_core.agent.loop \
            --hidden-import testcode_core.database \
            --hidden-import testcode_core.database.engine \
            --hidden-import testcode_core.database.models \
            --hidden-import testcode_core.session \
            --hidden-import testcode_core.session.store \
            --hidden-import testcode_core.tools \
            --hidden-import testcode_core.tools.registry \
            --hidden-import testcode_core.tools.bash \
            --hidden-import testcode_core.tools.file_read \
            --hidden-import testcode_core.tools.file_write \
            --hidden-import testcode_core.tools.file_edit \
            --hidden-import testcode_core.tools.glob_tool \
            --hidden-import testcode_core.tools.grep_tool \
            --hidden-import testcode_core.tools.web_fetch \
            --hidden-import testcode_llm \
            --hidden-import testcode_llm.provider \
            --hidden-import testcode_llm.registry \
            --hidden-import testcode_llm.types \
            --hidden-import testcode_llm.providers \
            --hidden-import testcode_llm.providers._anthropic \
            --hidden-import testcode_llm.providers._openai \
            --hidden-import testcode_cli \
            --hidden-import testcode_cli.main \
            --hidden-import testcode_tui \
            --hidden-import testcode_tui.app \
            --hidden-import testcode_tui.screens \
            --hidden-import testcode_tui.screens.main_screen \
            --hidden-import testcode_tui.widgets \
            --hidden-import testcode_tui.widgets.chat_view \
            --hidden-import testcode_tui.widgets.input_area \
            --hidden-import testcode_tui.widgets.session_list \
            --hidden-import testcode_tui.widgets.status_bar \
            --hidden-import testcode_server \
            --hidden-import testcode_server.app \
            --hidden-import testcode_sdk \
            --hidden-import testcode_sdk.client \
            --hidden-import testcode_sdk.types \
            --hidden-import testcode_plugin \
            --hidden-import testcode_plugin.hooks \
            --hidden-import testcode_plugin.decorators \
            --hidden-import testcode_plugin.loader \
            --hidden-import testcode_desktop \
            --hidden-import testcode_desktop.main \
            --hidden-import sqlalchemy \
            --hidden-import sqlalchemy.ext.asyncio \
            --hidden-import aiosqlite \
            --hidden-import fastapi \
            --hidden-import uvicorn \
            --hidden-import pydantic \
            --hidden-import sse_starlette \
            --hidden-import textual \
            --hidden-import textual_serve \
            --hidden-import textual_serve.server \
            --hidden-import typer \
            --hidden-import httpx \
            scripts/launcher.py 2>&1

      - name: List dist contents
        shell: bash
        run: ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: testcode-${{ matrix.os }}
          path: dist/testcode*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: testcode-*/
