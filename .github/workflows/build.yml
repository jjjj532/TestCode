name: Build TestCode

on:
  push:
    branches: [master]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y patchelf libcairo2-dev

      - name: Install dependencies
        run: |
          uv sync
          uv pip install pyinstaller

      - name: Debug - check Python and packages
        shell: bash
        run: |
          uv run python -c "import testcode_core; print('testcode_core OK:', testcode_core.__file__)"
          uv run python -c "import sqlalchemy; print('sqlalchemy OK')"
          uv run python -c "import httpx; print('httpx OK')"

      - name: Build with PyInstaller
        run: uv run pyinstaller --clean scripts/build.spec

      - name: List dist contents
        run: ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: testcode-${{ matrix.os }}
          path: dist/testcode*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: testcode-*/
